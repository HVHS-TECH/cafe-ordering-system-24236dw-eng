<!DOCTYPE html>
<html>
<head>
  <title>BALLER'S BALL SHOP</title>
  <link rel="stylesheet" href="style.css">
</head>
    
<body>
  
<h1>Baller's Ball Shop</h1>
<p>MATCH</p>

<div class="footballs-container">

<img src="images-removebg-preview (8).png" alt="Adidas">

<img src="images-removebg-preview (9).png" alt="Nike">

<img src="images-removebg-preview (10).png" alt="Mitre">

<img src="images-removebg-preview (19).png" alt="Puma">

  <form onsubmit="return false;">
